# Workflow graph for A.I.D.E.
#
# Hand-authored companion to the generated `skills.csv` / `skills.json`. Captures
# the parts of skill flow that cannot be inferred from SKILL.md frontmatter:
#   - Stage groupings and ordering
#   - Workflow edges (before / after between specific skills)
#   - Required gates (which review skills block which transitions)
#   - Mode-aware routing (greenfield / brownfield / quick-dev)
#
# Edit this file when:
#   - A new stage is introduced or an existing stage is renamed/reordered.
#   - The sequence of skills inside a flow changes.
#   - A new gate is required (e.g. a new review skill blocks a transition).
#   - A new flow is added.
#
# Skill names referenced below must match the `name` field of an existing
# SKILL.md (which equals the folder name). Run `scripts/build-registry.py` and
# the task #8 validation pass to confirm every reference resolves.

version: 1

stages:
  - id: meta
    description: "Cross-cutting orchestrators and utilities (start-project, customize-framework, framework-navigator, shared utilities)."
    order: 0
  - id: requirements
    description: "Gather, analyze, write, and review functional and non-functional requirements."
    order: 1
  - id: design
    description: "Translate approved requirements into a solution design package, including C4 diagrams and technology choices."
    order: 2
  - id: planning
    description: "Decompose the approved design into increments conforming to the Canonical Increment Shape."
    order: 3
  - id: quality
    description: "Consolidate quality strategy, test design (traced to acceptance criteria), and quality-engineering plan (automation, CI gates, test data, release gates) into the Quality Package before execution."
    order: 4
  - id: execution
    description: "Execute increments with TDD, manage bugs, and create pull requests."
    order: 5
  - id: reverse-engineering
    description: "Analyze and document existing code repositories (API, UI, DB, mobile, framework) into Part A/B docs that feed the knowledge base."
    order: 6
  - id: knowledge-base
    description: "Build, navigate, update, verify and audit the cross-repository knowledge base — both halves: the code-grounded half derived from RE, and the human-grounded solution-context / ai-rules / operations layer under shared/."
    order: 7
  - id: quick-dev
    description: "Lightweight scoped-change path: document-quick-change, plan-quick-change, execute-quick-change."
    order: 8
  # Integration tooling (Jira/Confluence extraction, document conversion) is no
  # longer part of core — it ships as a separate ADD-ON REPO (see
  # _docs/pluggable-tool-addons-proposal.md). When an add-on is installed and
  # registered via [registry].extra_skill_roots, its skills appear in the
  # registry tagged with the add-on's origin; flows consume them through the
  # source-adapter convention (references/orientation/source-adapters.md), not
  # through hardcoded stages here.

flows:
  greenfield:
    description: "Full SDLC from requirements through execution. Best for new projects with elaborate workflow."
    sequence:
      - skill: start-project
      # capture-solution-context runs before the first requirements package so
      # that package has project mission, personas, KPIs and constraints to
      # ground in. Project-scoped (<KB>/shared/), unlike the FEATURE-scoped
      # requirements package — the two layers do not overlap.
      - skill: capture-solution-context
      # Optional discovery input from Jira/Confluence is provided by an installed
      # tool ADD-ON (not core). When configured, create-requirements-package seeds
      # Step 1 discovery from the add-on via the source-adapter convention
      # (discovery_source; see references/orientation/source-adapters.md). The
      # adapter only seeds intake — it does NOT replace the step or its gate.
      - skill: create-requirements-package
        gates:
          - skill: review-requirements-package
            required: true
      - skill: create-design-package
        gates:
          - skill: review-design-package
            required: true
      # generate-ai-rules sits AFTER design in greenfield: there is no stack to
      # derive rules from until design has fixed the framework choices. In
      # brownfield it runs earlier, because RE Part A already carries the stack.
      - skill: generate-ai-rules
      - skill: create-implementation-package
        gates:
          - skill: review-implementation-package
            required: true
      # The quality stage is user-elected, not mandated. At review-implementation-package
      # GO the user picks one of two paths: quality-first (run create-quality-package and
      # let review-quality-package gate execution) or execute-first (go straight to
      # execute-increments; quality runs in parallel/deferred and is reconciled by
      # audit-quality-coverage). The choice is a per-run conversational decision, not a
      # project.toml setting. [project.testing].qe_repo only routes where QE-owned test
      # artifacts are written and does NOT decide this fork.
      - skill: create-quality-package
        optional: true
        role: user-elected
        condition: "user chose the quality-first path at review-implementation-package GO"
        gates:
          # Binds execution only within the quality-first path.
          - skill: review-quality-package
            required: true
      - skill: execute-increments
        per-increment-closing-skill: update-knowledge-base
      # document-operations runs once implementation has produced a deployment
      # shape to document. Optional because a pre-launch project has no infra
      # yet; the skill stops cleanly rather than inventing a topology.
      - skill: document-operations
        optional: true
        condition: "infra files exist (CI/CD config, IaC, deployment manifests)"
      - skill: create-pr

  brownfield:
    description: "Existing codebase. Reverse-engineer first to populate the KB, then run an enhancement flow."
    sequence:
      - skill: start-project
      - skill: analyze-repository
      # analyze-repository selects ONE of the domain skills at runtime:
      #   reverse-engineer-api, reverse-engineer-api-framework,
      #   reverse-engineer-database, reverse-engineer-mobile-app,
      #   reverse-engineer-mobile-framework, reverse-engineer-ui-framework,
      #   reverse-engineer-web-app, reverse-engineer-cobol-program,
      #   reverse-engineer-copybook-library, reverse-engineer-jcl-job,
      #   reverse-engineer-test-suite, reverse-engineer-serverless-lambda.
      # When no domain matches, analyze-repository routes to generate-re-skill
      # which can create new domain skills like reverse-engineer-serverless-lambda.
      # The placeholder below is a dispatcher slot — validation skips it.
      - skill: reverse-engineer-<dynamic>
        dispatcher: analyze-repository
      # RE close-out gate. Every reverse-engineer-* skill ends by ASKING the user how
      # to attest the extraction (see references/elicitation-patterns/
      # re-verification-gate-selection.md). Two legal exits:
      #   automated — steps/verify.md in `automated` mode issues a mechanical GO/NO-GO
      #               scoped to machine-checkable (Tier M) checks only; model-judgment
      #               (Tier J) checks are reported UNVERIFIED and never counted.
      #   review    — steps/verify.md in `review-evidence` mode (no verdict), then
      #               review-reverse-engineering-package runs nine sub-reviews with
      #               per-verdict human acceptance and owns the readiness verdict.
      # This is a user-elected fork like the quality-stage fork below — NOT an
      # unconditional gate. Either exit legally precedes build-knowledge-base; what is
      # not legal is ingesting an extraction that received neither.
      # [project.elicitation].re_verification_gate may pre-answer the question
      # ("ask" default / "review" / "automated"); unattended runs left on "ask" fail
      # fast rather than the AI picking a mode.
      - skill: review-reverse-engineering-package
        optional: true
        role: user-elected
        condition: "user chose the review path at the RE close-out gate"
      - skill: build-knowledge-base
      # For mainframe stacks (cobol-program + copybook-library + jcl-job all
      # contributed Part A), build-mainframe-data-lineage runs after
      # build-knowledge-base and produces <KB>/lineage/mainframe/. Optional
      # because non-mainframe projects don't need it.
      - skill: build-mainframe-data-lineage
        optional: true
        condition: "mainframe stack present (any of cobol-program, copybook-library, jcl-job in [[project.repos]])"
      - skill: verify-knowledge-base-coverage
      # The three solution-context skills run AFTER the code-grounded KB is in
      # place, so components/, graph.json and ARCHITECTURE.md exist to link from.
      # They also feed the first requirements package below: solution-context is
      # PROJECT-scoped (<KB>/shared/), create-requirements-package is
      # FEATURE-scoped ({paths.requirements_package}/<feature-id>/). The two layers do not overlap.
      #
      # In brownfield, generate-ai-rules can run this early because RE Part A
      # already carries the exact stack and build/test commands it derives from —
      # in greenfield it has to wait for design.
      - skill: capture-solution-context
      - skill: generate-ai-rules
      - skill: document-operations
        optional: true
        condition: "infra files exist (CI/CD config, IaC, deployment manifests)"
      # Optional discovery input from Jira/Confluence is provided by an installed
      # tool ADD-ON (not core), consumed via the source-adapter convention
      # (discovery_source; see references/orientation/source-adapters.md). The
      # adapter only seeds Step 1 discovery — it does NOT replace it or its gate.
      - skill: create-requirements-package
        # In brownfield mode this skill consumes the KB via navigate-knowledge-base.
        gates:
          - skill: review-requirements-package
            required: true
      - skill: create-design-package
        gates:
          - skill: review-design-package
            required: true
      - skill: create-implementation-package
        gates:
          - skill: review-implementation-package
            required: true
      # Same user-elected quality fork as greenfield: quality-first vs execute-first,
      # chosen per-run at review-implementation-package GO (not from project.toml).
      - skill: create-quality-package
        optional: true
        role: user-elected
        condition: "user chose the quality-first path at review-implementation-package GO"
        gates:
          # Binds execution only within the quality-first path.
          - skill: review-quality-package
            required: true
      - skill: execute-increments
        per-increment-closing-skill: update-knowledge-base
      - skill: create-pr

  quick-dev:
    description: "Small scoped change path. Skips full requirements/design/planning packages."
    sequence:
      - skill: start-project
      - skill: document-quick-change
      - skill: plan-quick-change
      - skill: execute-quick-change
        # update-knowledge-base runs in catalog-only scope after each increment.
        per-increment-closing-skill: update-knowledge-base
      - skill: create-pr

# Skills that may be invoked at any time, regardless of the active flow.
# These are cross-cutting utilities and KB consumers; they are intentionally
# omitted from flow `sequence` blocks so a missing reference there is a real
# error rather than an "anytime" misclassification.
anytime:
  - framework-navigator
  - customize-framework
  - manage-presets
  - shard-document
  - track-change
  # Feature registry / active-feature selection. Independently invocable, and
  # also the redirect target every write-side and read-side feature-ID
  # precondition names when no active feature resolves — see
  # config/SCHEMAS.md § 2.8-2.9 and _docs/feature-id-minimal-plan.md § 7.
  - select-feature
  - verify-source
  - manage-bugs
  - navigate-knowledge-base
  - detect-knowledge-base-drift
  # RE skill generator. Invoked by analyze-repository when no domain type matches,
  # or directly when user wants to create a new RE skill for an unsupported stack.
  - generate-re-skill
  # Adversarial-review layer. Both are runnable against any A.I.D.E. artifact and are
  # also invoked as sub-reviews 7-8 by review-reverse-engineering-package.
  - review-adversarial
  - review-edge-case-hunter
  # Per-repo RE readiness gate. Listed here as well as in the brownfield sequence
  # because it is independently invocable against an existing extraction without
  # re-running the RE skill that produced it.
  - review-reverse-engineering-package
  # Periodic global-KB audit. Distinct from the per-repo gate above and from
  # detect-knowledge-base-drift, which stays the cheap per-PR signal.
  - review-knowledge-base-package
  # Solution-context layer. Also placed in both flow sequences, but listed here
  # because a team refreshes personas, KPIs, AI rules or runbooks on its own
  # cadence — those go stale on a calendar, not on a commit.
  - capture-solution-context
  - generate-ai-rules
  - document-operations
  # Quality stage skills that are independently invocable at any time:
  #   - audit-quality-coverage: read-only coverage audit against the implementation package
  #   - review-test-failures: triage walk-through of a failed test run
  #   - execute-quality-increments: optional TC-XXX flow after a GO quality package
  - audit-quality-coverage
  - review-test-failures
  - execute-quality-increments
  # Jira/Confluence/document-convert utilities are provided by an installed tool
  # ADD-ON (not core). When the add-on is registered via
  # [registry].extra_skill_roots they are invocable anytime like these.

# Validation rules the registry generator (or task #8 validation) should enforce.
# `every-flow-skill-must-resolve` skips dispatcher placeholders (any skill name
# containing `<dynamic>`); `dispatcher:` should name the skill that performs
# the runtime selection.
validation:
  every-flow-skill-must-resolve: true
  every-gate-skill-must-resolve: true
  every-anytime-skill-must-resolve: true
