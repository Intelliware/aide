# Composition: Brownfield Enhancement Spec
#
# A SINGLE-document spec that spans requirements + design + planning. Used for
# enhancements to an existing system where producing three separate packages
# is overkill.
#
# Requirements-parity principle: the REQUIREMENTS portion mirrors the greenfield
# requirements shape block-for-block. Brownfield differs from greenfield only in
# that the pre-existing foundation is DISCOVERED (current-capability-baseline,
# KB) rather than authored — so foundation-level detail is not restated, and
# sections that describe only the change are delta-gated (include-if the
# enhancement touches that dimension). Nothing is removed outright; a requirement
# authored here should end up equivalent in scope to the greenfield equivalent.
#
# Design + planning stay deliberately lean (single increment).

name: brownfield-enhancement-spec
description: Combined req+design+plan spec in one artifact for enhancing an existing system.
applies-to-flow: brownfield
package-type: enhancement-spec

# The `{feature-id}/` segment applies only when `features.toml` exists; drop it
# otherwise. See references/ai-principles/feature-precondition.md.
default-output-path: "{paths.requirements_package}/{feature-id}/{feature-id}-enhancement-spec.md"

blocks:
  # ---- Framing ----
  - slug: shared/overview
    optional: false
    order: 1
  - slug: requirements/executive-summary-business-context
    optional: false
    order: 2
  - slug: requirements/business-objectives-success-criteria
    optional: false
    order: 2.5
    notes: |
      The enhancement's OWN objective and success criteria (the "why now" and
      definition-of-done). Required — an enhancement always has an objective,
      even though the product's overall objectives are pre-existing foundation.
      Kept lean: reference existing product objectives rather than restating
      them; capture only what this change adds or moves.
  - slug: requirements/stakeholders-personas
    optional: true
    order: 2.6
    include-if: "project.elicitation.changes_personas == true"
    notes: |
      Delta-gated on changes_personas — existing personas live in the KB /
      discovery baseline and are NOT restated. Included only when the
      enhancement introduces a NEW persona or role, or materially changes an
      existing one; capture only the delta.

  # ---- Requirements core (mirrors greenfield; foundation is discovered, delta is gated) ----
  - slug: requirements/functional-requirements
    optional: false
    order: 3
  - slug: requirements/functional-specifications
    optional: true
    order: 3.5
    include-if: "project.elicitation.has_complex_workflows == true"
    notes: |
      Workflow-level HOW behind the functional requirements. Included only when
      the enhancement introduces or changes a complex workflow; a simple change
      is fully described by functional-requirements alone.
  - slug: requirements/business-logic-rules
    optional: true
    order: 4
    include-if: "project.elicitation.has_business_rules == true"
  - slug: requirements/user-journeys
    optional: true
    order: 4.5
    include-if: "project.elicitation.has_ui == true"
    notes: |
      End-to-end user flows the enhancement adds or changes. Delta-gated on
      has_ui — a change with no user-facing surface reuses the pre-existing
      journeys captured in discovery rather than restating them.
  - slug: requirements/views-dashboards
    optional: true
    order: 4.6
    include-if: "project.elicitation.has_ui == true"
    notes: |
      Information architecture (WHAT to show, not HOW it looks) for views the
      enhancement adds or changes. Gated on has_ui — non-UI changes reuse the
      pre-existing views.
  - slug: requirements/data-requirements
    optional: true
    order: 5
    include-if: "project.elicitation.touches_data == true"
  - slug: requirements/permissions-access-control
    optional: true
    order: 5.5
    include-if: "project.elicitation.has_authn_authz == true"
    notes: |
      Roles and access rules the enhancement adds or changes. Mirrors the
      greenfield gate (has_authn_authz). A change that introduces a NEW trust
      boundary should also flip changes_security_boundary (design/security-design).
  - slug: requirements/non-functional-requirements
    optional: true
    order: 6
    include-if: "project.elicitation.changes_nfrs == true"
  - slug: requirements/assumptions-constraints-out-of-scope
    optional: false
    order: 7
    notes: |
      §12.2a Solution Constraints captures implementation guardrails the
      implementer must honor on every iteration — including any Solution
      Pivot after a failed verification. Required even when the user reports
      "no constraints" — render that explicitly as "None known at spec time"
      rather than omitting the section.
  - slug: requirements/acceptance-criteria
    optional: false
    order: 8

  # ---- Design core (lean) ----
  - slug: design/solution-architecture
    optional: false
    order: 9
  - slug: design/api-design
    optional: true
    order: 10
    include-if: "project.elicitation.changes_api == true"
  - slug: design/database-design
    optional: true
    order: 11
    include-if: "project.elicitation.changes_schema == true"
  - slug: design/security-design
    optional: true
    order: 12
    include-if: "project.elicitation.changes_security_boundary == true"
  - slug: design/testing-strategy
    optional: false
    order: 13

  # ---- Planning (canonical increment shape, single increment) ----
  - slug: planning/increment-identity
    optional: false
    order: 14
  - slug: planning/plan
    optional: false
    order: 15
  - slug: planning/automated-verification
    optional: false
    order: 16
  - slug: planning/human-verification
    optional: false
    order: 17
  - slug: planning/success-criteria
    optional: false
    order: 18

  # ---- Wrappers ----
  - slug: shared/glossary
    optional: false
    order: 19
  - slug: shared/traceability
    optional: false
    order: 20
  - slug: shared/change-log
    optional: false
    order: 21

elicitation:
  - prompt: references/elicitation-patterns/change-scope-discovery.md
    required: true
  - prompt: references/elicitation-patterns/impact-assessment.md
    required: true

decision-gates:
  - block: requirements/stakeholders-personas
    include-if: "project.elicitation.changes_personas == true"
  - block: requirements/functional-specifications
    include-if: "project.elicitation.has_complex_workflows == true"
  - block: requirements/business-logic-rules
    include-if: "project.elicitation.has_business_rules == true"
  - block: requirements/user-journeys
    include-if: "project.elicitation.has_ui == true"
  - block: requirements/views-dashboards
    include-if: "project.elicitation.has_ui == true"
  - block: requirements/data-requirements
    include-if: "project.elicitation.touches_data == true"
  - block: requirements/permissions-access-control
    include-if: "project.elicitation.has_authn_authz == true"
  - block: requirements/non-functional-requirements
    include-if: "project.elicitation.changes_nfrs == true"
  - block: design/api-design
    include-if: "project.elicitation.changes_api == true"
  - block: design/database-design
    include-if: "project.elicitation.changes_schema == true"
  - block: design/security-design
    include-if: "project.elicitation.changes_security_boundary == true"

notes: |
  This composition collapses the three-package forward-engineering flow into
  a single document for enhancements. Planning section uses a SINGLE increment;
  if the change spans multiple increments use greenfield-implementation-package
  per increment instead.

  Requirements parity: the requirements blocks above match the greenfield
  requirements package block-for-block (executive-summary, business-objectives,
  stakeholders-personas, functional-requirements, functional-specifications,
  business-logic-rules, user-journeys, views-dashboards, data-requirements,
  permissions-access-control, non-functional-requirements, assumptions/
  constraints, acceptance-criteria). The ONLY brownfield difference is that the
  pre-existing foundation is DISCOVERED (current-capability-baseline + KB) rather
  than authored, so every section that describes only the foundation is
  delta-gated with include-if — it renders only when the enhancement actually
  touches that dimension:
    - stakeholders-personas  -> changes_personas   (new persona/role introduced)
    - functional-specifications -> has_complex_workflows
    - business-logic-rules   -> has_business_rules
    - user-journeys          -> has_ui
    - views-dashboards       -> has_ui
    - data-requirements      -> touches_data
    - permissions-access-control -> has_authn_authz
    - non-functional-requirements -> changes_nfrs
  A brownfield requirement therefore ends up equivalent in scope to its
  greenfield counterpart for whatever the change touches, and silent on the
  untouched foundation. The changes_personas flag is flipped by the
  impact-assessment elicitation prompt; the rest are established project flags.

  Brownfield projects must already have a knowledge-base instance under
  paths.knowledge_base_path so traceability can link new increments back to
  existing components. If KB is missing, run reverse-eng compositions first.
