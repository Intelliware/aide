# Composition: Reverse-Engineering — Mobile Framework (Internal Part)
#
# Documents the INTERNAL architecture of a mobile framework / cross-platform
# toolkit (e.g., React Native, Flutter, NativeScript, Kotlin Multiplatform):
# runtime engine, native bridge, module system, rendering pipeline, gesture
# system, layout solver, state primitives, navigation internals, asset
# pipeline, network/storage/notification/permissions stacks, performance
# scheduler, devtools, testing harness, OTA, build system, compatibility
# strategy, source layout, conventions.
#
# Source: templates/blocks/reverse-eng/mobile-framework/internal/

name: re-mobile-framework-internal
description: Reverse-engineering KB for the internal implementation of a mobile framework.
applies-to-flow: reverse-eng
package-type: re-internal

default-output-path: "docs/mobile-framework-internal/"
default-output-shape: tree
# Path is RELATIVE to the source repo root (RE skill prepends the repo path).
# Tree shape: one .md file per block, named "<NN>-<bare-slug>.md" where NN is
# the 1-based zero-padded sort index after sorting blocks by `order`, and
# <bare-slug> is the slug with the "reverse-eng/mobile-framework/internal/" prefix stripped.
blocks:
  - slug: reverse-eng/mobile-framework/internal/architecture-overview
    optional: false
    order: 110
  - slug: reverse-eng/mobile-framework/internal/runtime-engine
    optional: false
    order: 120
  - slug: reverse-eng/mobile-framework/internal/native-bridge
    optional: false
    order: 130
  - slug: reverse-eng/mobile-framework/internal/module-system
    optional: false
    order: 140
  - slug: reverse-eng/mobile-framework/internal/ui-rendering-pipeline
    optional: false
    order: 150
  - slug: reverse-eng/mobile-framework/internal/gesture-and-event-system
    optional: true
    order: 160
    include-if: "project.elicitation.framework_provides_gesture_system == true"
  - slug: reverse-eng/mobile-framework/internal/layout-engine-internals
    optional: true
    order: 170
    include-if: "project.elicitation.framework_owns_layout == true"
  - slug: reverse-eng/mobile-framework/internal/state-and-data-flow
    optional: false
    order: 180
  - slug: reverse-eng/mobile-framework/internal/navigation-and-routing-internals
    optional: false
    order: 190
  - slug: reverse-eng/mobile-framework/internal/asset-pipeline
    optional: false
    order: 200
  - slug: reverse-eng/mobile-framework/internal/network-stack
    optional: true
    order: 210
    include-if: "project.elicitation.framework_provides_networking == true"
  - slug: reverse-eng/mobile-framework/internal/storage-internals
    optional: true
    order: 220
    include-if: "project.elicitation.framework_provides_storage == true"
  - slug: reverse-eng/mobile-framework/internal/notification-internals
    optional: true
    order: 230
    include-if: "project.elicitation.framework_provides_notifications == true"
  - slug: reverse-eng/mobile-framework/internal/permissions-system
    optional: true
    order: 240
    include-if: "project.elicitation.framework_provides_permissions == true"
  - slug: reverse-eng/mobile-framework/internal/performance-pipeline
    optional: false
    order: 250
  - slug: reverse-eng/mobile-framework/internal/debugging-and-devtools
    optional: false
    order: 260
  - slug: reverse-eng/mobile-framework/internal/testing-harness
    optional: false
    order: 270
  - slug: reverse-eng/mobile-framework/internal/release-channel-and-codepush-or-ota
    optional: true
    order: 280
    include-if: "project.elicitation.has_ota_updates == true"
  - slug: reverse-eng/mobile-framework/internal/build-system
    optional: false
    order: 290
  - slug: reverse-eng/mobile-framework/internal/compatibility-strategy
    optional: false
    order: 300
  - slug: reverse-eng/mobile-framework/internal/source-layout
    optional: false
    order: 310
  - slug: reverse-eng/mobile-framework/internal/conventions-and-idioms
    optional: false
    order: 320

elicitation:
  - prompt: references/elicitation-patterns/repo-scope-discovery.md
    required: true

decision-gates:
  - block: reverse-eng/mobile-framework/internal/gesture-and-event-system
    include-if: "project.elicitation.framework_provides_gesture_system == true"
  - block: reverse-eng/mobile-framework/internal/layout-engine-internals
    include-if: "project.elicitation.framework_owns_layout == true"
  - block: reverse-eng/mobile-framework/internal/network-stack
    include-if: "project.elicitation.framework_provides_networking == true"
  - block: reverse-eng/mobile-framework/internal/storage-internals
    include-if: "project.elicitation.framework_provides_storage == true"
  - block: reverse-eng/mobile-framework/internal/notification-internals
    include-if: "project.elicitation.framework_provides_notifications == true"
  - block: reverse-eng/mobile-framework/internal/permissions-system
    include-if: "project.elicitation.framework_provides_permissions == true"
  - block: reverse-eng/mobile-framework/internal/release-channel-and-codepush-or-ota
    include-if: "project.elicitation.has_ota_updates == true"

notes: |
  Block order follows order-hint values 110..320. Seven conditional gates,
  all agent-judged from the framework's own source during RE (no project.toml
  seeding required — the analysing agent sets each flag true only when the
  framework itself owns that subsystem):
    - gesture-and-event-system  (framework_provides_gesture_system)
    - layout-engine-internals   (framework_owns_layout)
    - network-stack             (framework_provides_networking)
    - storage-internals         (framework_provides_storage)
    - notification-internals    (framework_provides_notifications)
    - permissions-system        (framework_provides_permissions)
    - release-channel-and-codepush-or-ota (has_ota_updates)
  Rationale: a full framework (React Native / Flutter scale) owns these
  subsystems and renders all seven; a thin plugin-style framework that
  delegates a subsystem to a peer/host (e.g. NativeWind, a styling layer
  over react-native-css) sets the corresponding flag false and omits that
  block rather than emitting an "N/A / owned elsewhere" stub.
