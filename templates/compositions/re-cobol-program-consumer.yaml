# Composition: Reverse-Engineering — COBOL Program (Consumer Part)
#
# Documents how to invoke and integrate with one or more COBOL programs
# (the consumer view) — invocation, expected DDs, COMMAREA/LINKAGE shape,
# called subprograms, error/abend contract, integration examples.
#
# Source: templates/blocks/reverse-eng/cobol-program/consumer/

name: re-cobol-program-consumer
description: Reverse-engineering KB for consuming one or more COBOL programs as a caller / batch scheduler / integrator.
applies-to-flow: reverse-eng
package-type: re-consumer

default-output-path: "{paths.knowledge_base_path}/source-docs/{repo-slug}/cobol-program-consumer/"
default-output-shape: tree
# Path is rooted at the knowledge_base_path declared in project.toml.
# Tree shape: one .md file per block, named "<NN>-<bare-slug>.md" where NN is
# the 1-based zero-padded sort index after sorting blocks by `order`, and
# <bare-slug> is the slug with the "reverse-eng/cobol-program/consumer/" prefix stripped.
blocks:
  - slug: reverse-eng/cobol-program/consumer/how-to-invoke-this-program
    optional: false
    order: 290
  - slug: reverse-eng/cobol-program/consumer/expected-dd-bindings
    optional: false
    order: 300
  - slug: reverse-eng/cobol-program/consumer/commarea-and-linkage-contract
    optional: false
    order: 310
  - slug: reverse-eng/cobol-program/consumer/called-subprograms-and-side-effects
    optional: false
    order: 320
  - slug: reverse-eng/cobol-program/consumer/error-and-abend-contract
    optional: false
    order: 330
  - slug: reverse-eng/cobol-program/consumer/integration-examples
    optional: false
    order: 340

elicitation:
  - prompt: references/elicitation-patterns/repo-scope-discovery.md
    required: true

notes: |
  Block order follows order-hint values 290..340 (this part picks up where
  re-cobol-program-internal leaves off; ordering is shared with
  re-cobol-program-internal so both files compose into one continuous
  knowledge base if rendered together).

  For richer context, app teams should typically read both
  re-cobol-program-internal (DIVISIONs, PERFORM/CALL graph) and this
  consumer composition (how to invoke and what to expect).
